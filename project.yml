name: Perch

options:
  bundleIdPrefix: com.perch
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  Perch:
    type: application
    platform: macOS
    sources:
      - path: Perch
    info:
      path: Perch/Info.plist
      properties:
        CFBundleDisplayName: Perch
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: 0.2.0
        CFBundleVersion: 2
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSRemindersFullAccessUsageDescription: "Perch 在仪表盘上显示你的提醒事项待办。"
        NSLocationWhenInUseUsageDescription: "Perch 使用你的位置自动获取当地天气。"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.perch.Perch
        PRODUCT_NAME: Perch
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 2
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: true

schemes:
  Perch:
    build:
      targets:
        Perch: all
    run:
      config: Debug
